<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <text x="290" y="35" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Category-Wise Accuracy (N = 15 per category)</text>
  <text x="290" y="55" font-size="12" fill="#64748b" text-anchor="middle">Baseline ModernBERT Evaluation on Geography Benchmark</text>
  
    <!-- Category supported -->
    <text x="140" y="112" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Supported</text>
    <rect x="150" y="90" width="320" height="36" rx="6" fill="#f1f5f9"/>
    <rect x="150" y="90" width="320" height="36" rx="6" fill="#16a34a"/>
    <text x="480" y="113" font-size="13" font-weight="700" fill="#1e293b">100.0% (15/15)</text>

    <!-- Category contradictory -->
    <text x="140" y="160" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Contradictory</text>
    <rect x="150" y="138" width="320" height="36" rx="6" fill="#f1f5f9"/>
    <rect x="150" y="138" width="234" height="36" rx="6" fill="#dc2626"/>
    <text x="394" y="161" font-size="13" font-weight="700" fill="#1e293b">73.3% (11/15)</text>

    <!-- Category unsupported -->
    <text x="140" y="208" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Unsupported</text>
    <rect x="150" y="186" width="320" height="36" rx="6" fill="#f1f5f9"/>
    <rect x="150" y="186" width="320" height="36" rx="6" fill="#ea580c"/>
    <text x="480" y="209" font-size="13" font-weight="700" fill="#1e293b">100.0% (15/15)</text>

    <!-- Category mixed -->
    <text x="140" y="256" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Mixed</text>
    <rect x="150" y="234" width="320" height="36" rx="6" fill="#f1f5f9"/>
    <rect x="150" y="234" width="277" height="36" rx="6" fill="#2563eb"/>
    <text x="437" y="257" font-size="13" font-weight="700" fill="#1e293b">86.7% (13/15)</text>

  <line x1="150" y1="282" x2="470" y2="282" stroke="#cbd5e1" stroke-width="1"/>
  <text x="150" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">0%</text>
  <text x="310" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">50%</text>
  <text x="470" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">100%</text>
</svg>