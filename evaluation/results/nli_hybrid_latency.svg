<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <text x="270" y="32" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">CPU Inference Latency Breakdown (N = 60)</text>
  <text x="270" y="52" font-size="12" fill="#64748b" text-anchor="middle">Mean vs p95 Latency Across Evaluation Components</text>

  <!-- Group 1: LettuceDetect -->
  <text x="110" y="90" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">LettuceDetect</text>
  <rect x="70" y="157" width="35" height="63" rx="4" fill="#3b82f6"/>
  <text x="87" y="151" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">424ms</text>
  <rect x="115" y="126" width="35" height="94" rx="4" fill="#93c5fd"/>
  <text x="132" y="120" font-size="11" fill="#475569" text-anchor="middle">632ms</text>

  <!-- Group 2: NLI Verifier -->
  <text x="270" y="90" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">DeBERTa-v3 NLI</text>
  <rect x="230" y="179" width="35" height="41" rx="4" fill="#8b5cf6"/>
  <text x="247" y="173" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">274ms</text>
  <rect x="275" y="133" width="35" height="87" rx="4" fill="#c4b5fd"/>
  <text x="292" y="127" font-size="11" fill="#475569" text-anchor="middle">586ms</text>

  <!-- Group 3: Total Pipeline -->
  <text x="430" y="90" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Total Hybrid</text>
  <rect x="390" y="116" width="35" height="104" rx="4" fill="#059669"/>
  <text x="407" y="110" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">698ms</text>
  <rect x="435" y="52" width="35" height="168" rx="4" fill="#6ee7b7"/>
  <text x="452" y="46" font-size="11" fill="#475569" text-anchor="middle">1121ms</text>

  <line x1="50" y1="220" x2="490" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Legend -->
  <rect x="180" y="260" width="14" height="14" rx="2" fill="#3b82f6"/>
  <text x="200" y="272" font-size="11" fill="#475569">Mean Latency</text>
  <rect x="300" y="260" width="14" height="14" rx="2" fill="#93c5fd"/>
  <text x="320" y="272" font-size="11" fill="#475569">p95 Latency</text>
</svg>