<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <text x="270" y="32" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Category Accuracy: Baseline vs Hybrid</text>
  <text x="270" y="52" font-size="12" fill="#64748b" text-anchor="middle">N = 15 examples per category</text>

  <!-- Legend -->
  <rect x="170" y="65" width="14" height="14" rx="2" fill="#94a3b8"/>
  <text x="190" y="77" font-size="11" fill="#475569">Baseline ModernBERT</text>
  <rect x="310" y="65" width="14" height="14" rx="2" fill="#16a34a"/>
  <text x="330" y="77" font-size="11" font-weight="600" fill="#15803d">NLI Hybrid (Ours)</text>

  
    <!-- Category supported -->
    <text x="120" y="110" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Supported</text>
    
    <rect x="130" y="90" width="280" height="16" rx="3" fill="#94a3b8"/>
    <text x="416" y="102" font-size="11" fill="#64748b">100.0% (15/15)</text>
    
    <rect x="130" y="109" width="280" height="16" rx="3" fill="#16a34a"/>
    <text x="416" y="121" font-size="11" font-weight="700" fill="#15803d">100.0% (15/15)</text>

    <!-- Category contradictory -->
    <text x="120" y="162" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Contradictory</text>
    
    <rect x="130" y="142" width="205" height="16" rx="3" fill="#94a3b8"/>
    <text x="341" y="154" font-size="11" fill="#64748b">73.3% (11/15)</text>
    
    <rect x="130" y="161" width="280" height="16" rx="3" fill="#16a34a"/>
    <text x="416" y="173" font-size="11" font-weight="700" fill="#15803d">100.0% (15/15)</text>

    <!-- Category unsupported -->
    <text x="120" y="214" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Unsupported</text>
    
    <rect x="130" y="194" width="280" height="16" rx="3" fill="#94a3b8"/>
    <text x="416" y="206" font-size="11" fill="#64748b">100.0% (15/15)</text>
    
    <rect x="130" y="213" width="280" height="16" rx="3" fill="#16a34a"/>
    <text x="416" y="225" font-size="11" font-weight="700" fill="#15803d">100.0% (15/15)</text>

    <!-- Category mixed -->
    <text x="120" y="266" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Mixed</text>
    
    <rect x="130" y="246" width="242" height="16" rx="3" fill="#94a3b8"/>
    <text x="378" y="258" font-size="11" fill="#64748b">86.7% (13/15)</text>
    
    <rect x="130" y="265" width="280" height="16" rx="3" fill="#16a34a"/>
    <text x="416" y="277" font-size="11" font-weight="700" fill="#15803d">100.0% (15/15)</text>

  <line x1="130" y1="298" x2="410" y2="298" stroke="#cbd5e1" stroke-width="1"/>
  <text x="130" y="314" font-size="10" fill="#94a3b8" text-anchor="middle">0%</text>
  <text x="270" y="314" font-size="10" fill="#94a3b8" text-anchor="middle">50%</text>
  <text x="410" y="314" font-size="10" fill="#94a3b8" text-anchor="middle">100%</text>
</svg>