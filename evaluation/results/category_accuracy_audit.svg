<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect x="15" y="15" width="530" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="280" y="45" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">INDEPENDENT AUDIT: Category Accuracy</text>
  <text x="280" y="65" font-size="12" fill="#64748b" text-anchor="middle">Breakdown by Ground-Truth Category (N = 15 per quadrant)</text>
  
    <text x="135" y="112" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Supported</text>
    <rect x="145" y="90" width="300" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="145" y="90" width="300" height="32" rx="6" fill="#16a34a"/>
    <text x="455" y="111" font-size="13" font-weight="700" fill="#0f172a">100.0% (15/15)</text>

    <text x="135" y="160" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Unsupported</text>
    <rect x="145" y="138" width="300" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="145" y="138" width="300" height="32" rx="6" fill="#0284c7"/>
    <text x="455" y="159" font-size="13" font-weight="700" fill="#0f172a">100.0% (15/15)</text>

    <text x="135" y="208" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Mixed</text>
    <rect x="145" y="186" width="300" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="145" y="186" width="260" height="32" rx="6" fill="#6366f1"/>
    <text x="415" y="207" font-size="13" font-weight="700" fill="#0f172a">86.7% (13/15)</text>

    <text x="135" y="256" font-size="13" font-weight="600" fill="#334155" text-anchor="end">Contradictory</text>
    <rect x="145" y="234" width="300" height="32" rx="6" fill="#f1f5f9"/>
    <rect x="145" y="234" width="219" height="32" rx="6" fill="#dc2626"/>
    <text x="374" y="255" font-size="13" font-weight="700" fill="#0f172a">73.3% (11/15)</text>

  <line x1="145" y1="282" x2="445" y2="282" stroke="#cbd5e1" stroke-width="1"/>
  <text x="145" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">0%</text>
  <text x="295" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">50%</text>
  <text x="445" y="300" font-size="11" fill="#94a3b8" text-anchor="middle">100%</text>
</svg>