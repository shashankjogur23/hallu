<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" width="540" height="370" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <text x="270" y="32" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Baseline ModernBERT vs NLI Hybrid Performance</text>
  <text x="270" y="52" font-size="12" fill="#64748b" text-anchor="middle">Answer-Level Benchmark Comparison (N = 60)</text>

  <!-- Legend -->
  <rect x="180" y="65" width="14" height="14" rx="2" fill="#94a3b8"/>
  <text x="200" y="77" font-size="11" fill="#475569">Baseline ModernBERT</text>
  <rect x="320" y="65" width="14" height="14" rx="2" fill="#2563eb"/>
  <text x="340" y="77" font-size="11" font-weight="600" fill="#1e40af">NLI Hybrid (Ours)</text>

  
    <!-- Accuracy -->
    <text x="110" y="110" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Accuracy</text>
    
    <!-- Baseline bar -->
    <rect x="120" y="90" width="270" height="16" rx="3" fill="#94a3b8"/>
    <text x="396" y="102" font-size="11" font-weight="600" fill="#64748b">90.0%</text>
    
    <!-- Hybrid bar -->
    <rect x="120" y="109" width="300" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="121" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>

    <!-- Precision -->
    <text x="110" y="158" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Precision</text>
    
    <!-- Baseline bar -->
    <rect x="120" y="138" width="300" height="16" rx="3" fill="#94a3b8"/>
    <text x="426" y="150" font-size="11" font-weight="600" fill="#64748b">100.0%</text>
    
    <!-- Hybrid bar -->
    <rect x="120" y="157" width="300" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="169" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>

    <!-- Recall -->
    <text x="110" y="206" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Recall</text>
    
    <!-- Baseline bar -->
    <rect x="120" y="186" width="260" height="16" rx="3" fill="#94a3b8"/>
    <text x="386" y="198" font-size="11" font-weight="600" fill="#64748b">86.7%</text>
    
    <!-- Hybrid bar -->
    <rect x="120" y="205" width="300" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="217" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>

    <!-- Specificity -->
    <text x="110" y="254" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Specificity</text>
    
    <!-- Baseline bar -->
    <rect x="120" y="234" width="300" height="16" rx="3" fill="#94a3b8"/>
    <text x="426" y="246" font-size="11" font-weight="600" fill="#64748b">100.0%</text>
    
    <!-- Hybrid bar -->
    <rect x="120" y="253" width="300" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="265" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>

    <!-- F1-Score -->
    <text x="110" y="302" font-size="12" font-weight="600" fill="#334155" text-anchor="end">F1-Score</text>
    
    <!-- Baseline bar -->
    <rect x="120" y="282" width="278" height="16" rx="3" fill="#94a3b8"/>
    <text x="404" y="294" font-size="11" font-weight="600" fill="#64748b">92.9%</text>
    
    <!-- Hybrid bar -->
    <rect x="120" y="301" width="300" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="313" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>

  <line x1="120" y1="330" x2="420" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="346" font-size="10" fill="#94a3b8" text-anchor="middle">0%</text>
  <text x="270" y="346" font-size="10" fill="#94a3b8" text-anchor="middle">50%</text>
  <text x="420" y="346" font-size="10" fill="#94a3b8" text-anchor="middle">100%</text>
</svg>