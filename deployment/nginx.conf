# ==============================================================================
# Nginx Reverse Proxy Configuration for HalluGuard
# ==============================================================================
# Target location on Ubuntu VM: /etc/nginx/sites-available/halluguard
# Symlink to: /etc/nginx/sites-enabled/halluguard
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain (e.g. halluguard.example.com) or VM external IP

    # Logging
    access_log /var/log/nginx/halluguard_access.log;
    error_log /var/log/nginx/halluguard_error.log;

    # Maximum file upload size for reference PDF and TXT documents
    client_max_body_size 25M;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Frontend Static Assets (Compiled React / Vite Single Page Application)
    # --------------------------------------------------------------------------
    root /opt/halluguard/HalluGuard/frontend/dist;
    index index.html;

    # Frontend SPA routing (serves index.html for all client-side navigation)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Vite static chunks (JS, CSS, images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. FastAPI Backend API Endpoints (Proxied to 127.0.0.1:8000)
    # --------------------------------------------------------------------------
    # Direct routing matching actual backend endpoint signatures:
    #   - /verify (Core ModernBERT inference)
    #   - /health (Health & status check)
    #   - /context/* (Chunking & retrieval)
    #   - /verifications/* (History & statistics)
    #   - /documents/* (Document ingestion & listing)
    #   - /docs, /redoc, /openapi.json (Swagger interactive documentation)
    # --------------------------------------------------------------------------
    location ~ ^/(health|verify|context|verifications|documents|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer adjustments for document uploads
        proxy_buffering off;
        proxy_request_buffering on;

        # Extended timeouts for initial model execution and large passage batching
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 3. Security Hardening
    # --------------------------------------------------------------------------
    # Deny access to hidden files (e.g., .env, .git, .gitignore)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to source code or python cache if ever referenced
    location ~* \.(py|pyc|sh|sql|md|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Configuration (Let's Encrypt / Certbot)
# ------------------------------------------------------------------------------
# After pointing your DNS A-record to the VM external IP, run:
#   sudo certbot --nginx -d yourdomain.com
#
# Certbot will automatically configure the SSL server block on port 443
# and setup HTTP-to-HTTPS redirect.

